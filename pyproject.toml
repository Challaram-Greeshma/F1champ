[project]
name = "f1champ"
version = "0.1.0"
description = "Leakage-safe Stage 1 Formula 1 historical results model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
f1champ = "f1champ.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
